[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mystree-triage-engine"
version = "0.2.0-alpha"
description = "Deterministic Women's Health Clinical Risk Triage Engine (v0.2 Day 4 & Day 5 Complete)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Adarsh & Antigravity Clinical Engineering Team" }
]
keywords = ["clinical-triage", "womens-health", "deterministic-rules", "evidence-based"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
triage-cli = "src.cli:main"
triage-flowcharts = "src.flowchart_generator:main"
triage-generate-cases = "src.synthetic_generator:main"
triage-review-server = "src.review_server:main"
triage-report = "src.feedback_report:main"

