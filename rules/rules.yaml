- id: PCOS-001
  domain: pcos
  name: Ovulatory dysfunction screening in adult women (>= 3 yrs post-menarche)
  when:
    all:
    - field: adult_gynecological_age
      op: ==
      value: true
    - field: pregnancy_excluded
      op: ==
      value: true
    - field: hormonal_cycle_interference
      op: ==
      value: false
    - any:
      - field: cycle_length_days
        op: <
        value: 21
      - field: cycle_length_days
        op: '>'
        value: 35
      - field: cycles_per_year
        op: <
        value: 8
  level: teleconsultation
  needs_physical_exam: false
  reason: Menstrual cycle frequency outside 21 to 35 days in adult gynecological age
    suggestive of ovulatory dysfunction.
  advice: Please consult a healthcare provider for routine evaluation of cycle irregularity
    and ovulatory function.
  doctor_may_suggest:
  - serum androgen panel (total/free testosterone, SHBG, FAI)
  - TSH and prolactin to exclude thyroid or hyperprolactinemic disorder
  - cycle tracking and lifestyle optimization
  source:
    name: 2023 International Evidence-based PCOS Guideline
    url: https://www.monash.edu/medicine/mchri/pcos/guideline
    section: Recommendation 1.1.1 (Ovulatory dysfunction criteria)
