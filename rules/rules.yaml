- id: IRR-006
  domain: irregular_periods
  name: Functional hypothalamic amenorrhea (FHA) suspicion
  when:
    all:
    - field: days_since_last_period
      op: '>'
      value: 90
    - field: never_had_period
      op: ==
      value: 'no'
    - field: pregnancy_excluded
      op: ==
      value: true
    - field: hormonal_cycle_interference
      op: ==
      value: false
    - field: physiological_lactational_amenorrhea
      op: '!='
      value: true
    - any:
      - field: significant_weight_loss_or_heavy_training
        op: ==
        value: 'yes'
      - field: bmi
        op: <
        value: 18.5
  level: teleconsultation
  needs_physical_exam: false
  reason: "Absent periods for > 90 days associated with significant weight loss, intensive\
    \ exercise, or low BMI (< 18.5 kg/m\xB2)."
  advice: Please consult a doctor via teleconsultation. Amenorrhea associated with
    weight loss or heavy training can be linked to low energy availability. A doctor
