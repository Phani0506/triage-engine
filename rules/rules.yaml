- id: PCOS-005
  domain: pcos
  name: Rapid virilization / Androgen-secreting neoplasm screen
  when:
    any:
    - field: rapid_virilization_signs
      op: ==
      value: 'yes'
    - field: rapid_virilization
      op: ==
      value: 'yes'
  level: clinic_visit
  needs_physical_exam: true
  physical_exam_reason: Urgent in-person physical assessment and specialized endocrine
    imaging to exclude virilizing ovarian or adrenal neoplasm.
  reason: Rapid voice deepening, clitoromegaly, or sudden severe masculinization requires
    urgent in-person medical evaluation to exclude hormone-secreting tumors.
  advice: Please see a doctor in person promptly. Sudden or rapid virilisation requires
    in-person specialist investigations to rule out adrenal or ovarian causes.
  doctor_may_suggest:
  - urgent serum total testosterone, DHEAS, and 17-OHP measurement
  - pelvic ultrasound and adrenal CT/MRI imaging
  - urgent endocrinology referral
  source:
    name: 2023 International Evidence-based PCOS Guideline / Endocrine Society
    url: https://www.monash.edu/medicine/mchri/pcos/guideline
    section: Practice Point 1.2.9 (Rapid virilization warning sign)
