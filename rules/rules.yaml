# ==============================================================================
# Women's Health Clinical Risk Triage Engine - Rule Definitions (v0.1 Foundation)
# ------------------------------------------------------------------------------
# Day 3 Scope: 29 Baseline Entries (8 Red Flags, 7 Gates, 14 Irregular Periods)
#              + 2 Candidate Gap Rules (RF-009, EP-001, Inactive by Default)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. RED FLAGS (RF-001 to RF-008, plus candidate RF-009, EP-001)
# ------------------------------------------------------------------------------

- id: RF-001
  domain: red_flags
  name: Suspected ectopic pregnancy (acute severe pain)
  when:
    all:
      - field: pregnancy_excluded
        op: "in"
        value: [false, "unknown"]
      - field: acute_severe_pelvic_pain
        op: "=="
        value: "yes"
  level: emergency
  needs_physical_exam: true
  physical_exam_reason: "Immediate hemodynamic evaluation, transvaginal ultrasound, and surgical assessment to exclude ruptured ectopic pregnancy."
  reason: "Sudden, severe, or unbearable lower belly/pelvic pain when pregnancy is not ruled out."
  advice: "Please go to the nearest hospital emergency department (A&E) immediately. Severe pelvic pain when pregnancy is possible can be a sign of an ectopic pregnancy."
  doctor_may_suggest:
    - "emergency transvaginal ultrasound"
    - "quantitative serum beta-hCG"
    - "full blood count and blood type/cross-match"
  safety_net:
    - "severe dizziness or collapsing"
    - "shoulder-tip pain"
    - "heavy vaginal bleeding"
  source:
    name: "NICE NG126"
    url: "https://www.nice.org.uk/guidance/ng126/chapter/Recommendations#assessment-in-specialist-services"
    section: "Section 1.3 Rec 1.3.1 & Section 1.2 Rec 1.2.1"
    number_checked: "Qualitative: severe acute pain + pregnancy not excluded"
    date: "April 2019; updated 17 June 2026"
    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval

- id: RF-002
  domain: red_flags
  name: Suspected ectopic pregnancy (shoulder-tip pain)
  when:
    all:
      - field: pregnancy_excluded
        op: "in"
        value: [false, "unknown"]
      - field: shoulder_tip_pain
        op: "=="
        value: "yes"
      - any:
          - field: pelvic_pain_any
            op: "=="
            value: "yes"
          - field: vaginal_bleeding_now
            op: "=="
            value: "yes"
  level: emergency
  needs_physical_exam: true
  physical_exam_reason: "Shoulder-tip pain indicates diaphragmatic irritation from internal intraperitoneal bleeding secondary to ruptured ectopic pregnancy."
  reason: "Unexplained shoulder-tip pain alongside pelvic pain or vaginal bleeding when pregnancy is not ruled out."
  advice: "Please go to the nearest hospital emergency department immediately. Shoulder-tip pain with pelvic symptoms can indicate internal bleeding from an ectopic pregnancy."
  doctor_may_suggest:
    - "emergency transvaginal ultrasound"
    - "quantitative serum beta-hCG"
    - "immediate surgical evaluation"
  source:
    name: "NICE NG126 / RCOG"
    url: "https://www.rcog.org.uk/for-the-public/browse-our-patient-information/ectopic-pregnancy/"
    section: "NICE NG126 Section 1.2 Rec 1.2.2; RCOG Patient Information"
    number_checked: "Qualitative: shoulder-tip pain with bleeding or pain"
    date: "Patient info updated 2024"
    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval

- id: RF-003
  domain: red_flags
  name: Acute heavy bleeding with hemodynamic instability
  when:
    all:
      - field: soaking_pad_hourly_2plus_hours
        op: "=="
        value: "yes"
      - field: reported_hemodynamic_instability
        op: "=="
        value: true
  level: emergency
  needs_physical_exam: true
  physical_exam_reason: "Severe blood loss with circulatory compromise requires immediate IV fluid resuscitation and urgent exam."
  reason: "Bleeding heavily enough to soak through a pad or tampon every hour for 2+ hours, accompanied by fainting, dizziness, or a racing heart at rest."
  advice: "Please go to the nearest emergency department immediately. Soaking pads hourly with symptoms of dizziness or fainting indicates rapid blood loss requiring urgent treatment."
  doctor_may_suggest:
    - "intravenous fluid resuscitation"
    - "urgent full blood count and cross-match"
    - "pelvic examination and ultrasound"
  source:
    name: "ACOG Committee Opinion No. 557 / CDC"
    url: "https://www.cdc.gov/ncbddd/blooddisorders/women/menorrhagia.html"
    section: "ACOG CO 557 Initial Evaluation; CDC Menorrhagia Criteria"
    number_checked: "Soaking >= 1 pad/hr for >= 2 hrs with vital instability (D11)"
    date: "April 2013, reaffirmed 2023"
    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval
  pending_clinical_decision: DEC-01

- id: RF-004
  domain: red_flags
  name: Hemodynamic collapse or syncope with bleeding or pain
  when:
    all:
      - field: fainting_or_near_fainting
        op: "=="
        value: "yes"
      - any:
          - field: vaginal_bleeding_now
            op: "=="
            value: "yes"
          - field: pelvic_pain_any
            op: "=="
            value: "yes"
          - field: acute_severe_pelvic_pain
            op: "=="
            value: "yes"
          - field: soaking_pad_hourly_2plus_hours
            op: "=="
            value: "yes"
  level: emergency
  needs_physical_exam: true
  physical_exam_reason: "Direct clinical marker of hypovolemic shock, circulatory collapse, or intra-abdominal bleeding."
  reason: "Fainting, collapse, or near-fainting occurring alongside vaginal bleeding or pelvic pain."
  advice: "Please seek emergency medical care immediately. Fainting or severe dizziness with bleeding or pelvic pain requires urgent emergency evaluation."
  doctor_may_suggest:
    - "vital signs and orthostatic blood pressure check"
    - "intravenous fluid resuscitation"
    - "emergency ultrasound and hemoglobin check"
  source:
    name: "NICE NG126 / ACOG CO 557"
    url: "https://cks.nice.org.uk/topics/ectopic-pregnancy/background-information/red-flag-symptoms/"
    section: "NICE CKS Ectopic Red Flags; NICE NG126 Rec 1.3.1"
    number_checked: "Qualitative: syncope with bleeding or pain"
    date: "2023 update"
    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval

- id: RF-005
  domain: red_flags
  name: Severe acute pelvic infection / sepsis risk
  when:
    all:
      - field: pelvic_pain_any
        op: "=="
        value: "yes"
      - field: pelvic_infection_severity_marker
        op: "=="
        value: true
  level: emergency
  needs_physical_exam: true
  physical_exam_reason: "Evaluation and parenteral IV antibiotics for severe acute PID with suspected abscess or sepsis."
  reason: "Pelvic pain accompanied by severe systemic illness, high fever (> 38.5°C), or persistent vomiting."
  advice: "Please go to the nearest hospital emergency department immediately. Pelvic pain with high fever or severe illness can indicate a severe pelvic infection requiring hospital care."
  doctor_may_suggest:
    - "blood cultures and inflammatory markers (CRP, ESR)"
    - "pelvic ultrasound to rule out tubo-ovarian abscess"
    - "parenteral intravenous antibiotics"
  source:
    name: "CDC STI Treatment Guidelines / RCOG GTG 32"
    url: "https://www.cdc.gov/std/treatment-guidelines/pid.htm"
    section: "CDC PID Hospitalization Criteria; RCOG GTG 32 Sec 5"
    number_checked: "Fever > 38.5°C (> 101°F) OR severe prostration OR vomiting"
    date: "2021"
    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval
  pending_clinical_decision: DEC-02

- id: RF-006
  domain: red_flags
  name: Confirmed early pregnancy with bleeding and pain
  when:
    all:
      - field: pregnancy_test_result
        op: "=="
        value: "positive"
      - field: vaginal_bleeding_now
        op: "=="
        value: "yes"
      - field: pelvic_pain_any
        op: "=="
        value: "yes"
      - field: acute_severe_pelvic_pain
        op: "!="
        value: "yes"
      - field: reported_hemodynamic_instability
        op: "!="
        value: true
  level: clinic_visit
  proposed_levels:
    primary: clinic_visit
    alternative: emergency
  needs_physical_exam: true
  physical_exam_reason: "Urgent speculum examination and transvaginal ultrasound within 24 hours to confirm pregnancy location and viability."
  reason: "Positive pregnancy test with concurrent vaginal bleeding and pelvic pain (without severe collapse)."
  advice: "Please attend an early pregnancy assessment clinic or hospital for an in-person assessment within 24 hours. A scan is needed to check the location and progress of the pregnancy."
  doctor_may_suggest:
    - "transvaginal ultrasound scan"
    - "repeat serum quantitative beta-hCG in 48 hours"
    - "speculum examination"
  source:
    name: "NICE NG126"
    url: "https://www.nice.org.uk/guidance/ng126/chapter/Recommendations#assessment-in-specialist-services"
    section: "Section 1.1 Rec 1.1.2 & Section 1.3 Rec 1.3.1, 1.3.4"
    number_checked: "Assessment within 24 hours for stable early pregnancy pain and bleeding"
    date: "Updated 17 June 2026"
    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval
  pending_clinical_decision: DEC-03

- id: RF-007
  domain: red_flags
  name: Sudden severe pelvic pain with vomiting (ovarian torsion risk)
  when:
    all:
      - field: acute_severe_pelvic_pain
        op: "=="
        value: "yes"
      - field: sudden_pain_with_vomiting
        op: "=="
        value: "yes"
  level: emergency
  needs_physical_exam: true
  physical_exam_reason: "Urgent Doppler ultrasound and surgical exploration to rule out ovarian/adnexal torsion."
  reason: "Sudden, severe lower belly pain starting abruptly with nausea or vomiting."
  advice: "Please go to the nearest emergency department immediately. Sudden severe pelvic pain with vomiting can indicate an ovarian problem requiring urgent surgical review."
  doctor_may_suggest:
    - "urgent pelvic Doppler ultrasound"
    - "emergency gynecological surgical consultation"
    - "pain relief and intravenous fluids"
  source:
    name: "ACOG CO 783 / RCOG GTG 62"
    url: "https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2019/08/adnexal-torsion-in-adolescents"
    section: "ACOG CO 783 Clinical Presentation; RCOG GTG 62 Section 4"
    number_checked: "Qualitative: severe abrupt pain with nausea or vomiting"
    date: "August 2019, reaffirmed 2021"
    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval

- id: RF-008
  domain: red_flags
  name: Secondary postpartum hemorrhage or severe postpartum infection
  when:
    all:
      - field: postpartum_delivery_timing
        op: "in"
        value: ["within_6_weeks", "6_to_12_weeks"]
      - field: postpartum_heavy_or_increasing_bleeding_or_clots
        op: "=="
        value: "yes"
      - any:
          - field: reported_hemodynamic_instability
            op: "=="
            value: true
          - field: fever_over_38_5c
            op: "=="
            value: "yes"
  level: emergency
  needs_physical_exam: true
  physical_exam_reason: "Urgent evaluation for secondary postpartum hemorrhage, retained tissue, or endometritis."
  reason: "Heavy bleeding or large clots within 12 weeks of childbirth, accompanied by fainting, racing heart, or high fever."
  advice: "Please go to the nearest maternity emergency department or hospital immediately. Heavy bleeding with fever or dizziness in the weeks after childbirth requires urgent care."
  doctor_may_suggest:
    - "urgent pelvic ultrasound for retained products of conception"
    - "intravenous antibiotics and uterotonics"
    - "full blood count and coagulation profile"
  source:
    name: "NICE NG194 / RCOG GTG 52"
    url: "https://www.nice.org.uk/guidance/ng194/chapter/Recommendations#symptoms-and-signs-of-serious-postnatal-conditions"
    section: "NICE NG194 Section 1.2; RCOG GTG 52 Section 6"
    number_checked: "Postpartum <= 12 weeks with heavy bleeding/clots and instability or fever"
    date: "April 2021"
    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval
  pending_clinical_decision: DEC-04

