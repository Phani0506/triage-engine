- id: FERT-005
  domain: fertility
  name: Subfertility with ovulatory dysfunction or irregular cycles
  when:
    all:
    - field: trying_to_conceive
      op: ==
      value: 'yes'
    - field: pcos_ovulatory_dysfunction_pattern
      op: ==
      value: true
  level: teleconsultation
  needs_physical_exam: false
  reason: Trying to conceive with irregular or infrequent menstrual cycles indicates
    ovulatory dysfunction requiring medical assessment.
  advice: Please schedule a consultation with a doctor. Irregular cycles while trying
    to conceive indicate that ovulation may be irregular, and medical evaluation can
    help identify and treat the cause.
  doctor_may_suggest:
  - hormonal assessment (FSH, LH, prolactin, TSH, androgen panel)
  - pelvic ultrasound
  - discussion of ovulation induction options (e.g., letrozole)
  source:
    name: NICE NG257 / ASRM
