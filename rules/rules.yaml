    approval_status: mapping_pending_doctor_approval
- id: FERT-006
  domain: fertility
  name: Subfertility with history of tubal risk factors
  when:
    all:
    - field: trying_to_conceive
      op: ==
      value: 'yes'
    - field: tubal_risk_history
      op: ==
      value: true
  level: clinic_visit
  needs_physical_exam: true
  physical_exam_reason: In-person evaluation and imaging/patency referral for high-risk
    tubal factor history.
  reason: Trying to conceive with a history of PID, ectopic pregnancy, or pelvic surgery
    poses significant risk of tubal occlusion.
  advice: Please see a doctor in person. A history of pelvic infection, ectopic pregnancy,
    or pelvic surgery warrants earlier in-person evaluation and tests to check fallopian
    tube patency.
  doctor_may_suggest:
  - hysterosalpingography (HSG) or HyCoSy to check tubal patency
  - chlamydia antibody or current NAAT screening
  - gynecology or fertility specialist referral
  source:
    name: NICE NG257
    url: https://www.nice.org.uk/guidance/ng257
    section: Recommendation 1.2.2 (Early investigation for tubal factors)
    number_checked: Immediate referral without waiting if history of PID, ectopic,
      or pelvic surgery
    date: '2024'
    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval
- id: FERT-007
