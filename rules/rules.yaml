      - field: pregnancy_excluded
        op: "=="
        value: true
      - field: acute_severe_pelvic_pain
        op: "=="
        value: "yes"
  level: emergency
  is_candidate_rule: true
  needs_physical_exam: true
  physical_exam_reason: "Emergency surgical evaluation for appendicitis, ruptured cyst, or pelvic peritonitis."
  reason: "Severe, acute pelvic pain even with pregnancy excluded requires urgent emergency surgical evaluation."
  advice: "Please go to the nearest hospital emergency department immediately. Sudden severe pelvic pain can be a surgical emergency."
  doctor_may_suggest:
    - "abdominal and pelvic CT or ultrasound"
    - "surgical consultation"
  source:
    name: "NICE NG126 / Surgical Consensus"
    url: "https://www.nice.org.uk/guidance/ng126"
    section: "Acute surgical differential"
    number_checked: "Acute severe pelvic pain with negative pregnancy test"
    date: "2023"
    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval
  pending_clinical_decision: DEC-08

- id: EP-001
  domain: red_flags
  name: Early pregnancy with painless vaginal bleeding (Threatened miscarriage)
  when:
    all:
      - field: pregnancy_test_result
        op: "=="
        value: "positive"
      - field: vaginal_bleeding_now
        op: "=="
        value: "yes"
      - field: pelvic_pain_any
        op: "=="
        value: "no"
      - field: reported_hemodynamic_instability
        op: "=="
        value: false
  level: clinic_visit
  is_candidate_rule: true
  needs_physical_exam: true
  physical_exam_reason: "Clinical assessment and transvaginal ultrasound within 24 hours to confirm fetal viability."
  reason: "Positive pregnancy test with painless vaginal bleeding without shock."
  advice: "Please arrange an in-person assessment at an early pregnancy assessment clinic within 24 hours."
  doctor_may_suggest:
    - "transvaginal ultrasound scan"
    - "speculum examination"
  source:
    name: "NICE NG126"
    url: "https://www.nice.org.uk/guidance/ng126/chapter/Recommendations"
    section: "Section 1.1 Rec 1.1.2 & Section 1.3 Rec 1.3.4"
    number_checked: "EPAS assessment within 24 hours"
    date: "Updated 17 June 2026"
    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval
  pending_clinical_decision: DEC-08

