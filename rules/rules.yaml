    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval
- id: IRR-007
  domain: irregular_periods
  name: Intermenstrual bleeding (IMB) in >= 2 cycles or persistent pelvic pain/pressure
  when:
    any:
    - field: intermenstrual_bleeding_cycles
      op: '>='
      value: 2
    - all:
      - any:
        - field: self_reported_heavy_flow
          op: ==
          value: 'yes'
        - field: bleeding_duration_days
          op: '>'
          value: 8
        - field: intermenstrual_bleeding_cycles
          op: '>='
          value: 1
      - field: persistent_pelvic_pain_or_pressure
        op: ==
        value: 'yes'
