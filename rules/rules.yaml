- id: IRR-001
  domain: irregular_periods
  name: Normal physiological menstrual cycle parameters
  when:
    all:
    - field: never_had_period
      op: ==
      value: 'no'
    - field: days_since_last_period
      op: <=
      value: 38
    - field: cycle_length_days
      op: '>='
      value: 24
    - field: cycle_length_days
      op: <=
      value: 38
    - field: bleeding_duration_days
      op: <=
      value: 8
    - field: self_reported_heavy_flow
      op: ==
      value: 'no'
    - field: intermenstrual_bleeding_cycles
      op: ==
      value: 0
    - field: postcoital_bleeding
      op: ==
      value: 'no'
    - field: persistent_pelvic_pain_or_pressure
      op: ==
      value: 'no'
    - field: palpable_pelvic_lump
      op: ==
      value: 'no'
    - field: period_pain_affects_daily_life
      op: ==
      value: 'no'
    - any:
      - all:
        - field: age
          op: <=
          value: 25
        - field: cycle_variation_days
          op: <=
          value: 9
      - all:
        - field: age
          op: '>='
          value: 26
        - field: cycle_variation_days
          op: <=
          value: 7
  level: self_care
  needs_physical_exam: false
  reason: Menstrual cycle length, variation, and duration are within normal biological
    ranges with no abnormal bleeding or pain flags.
  advice: Your cycle parameters are within normal physiological ranges. Continue tracking
    your cycles. If your cycle pattern changes or you develop symptoms, speak with
    a healthcare provider.
  safety_net:
  - bleeding that soaks through a pad or tampon every hour for 2 hours in a row
  - severe lower belly pain that does not settle
  - fainting or feeling very dizzy
  - bleeding after sexual intercourse
  source:
    name: FIGO 2018 System 1 (Munro et al.)
    url: https://www.ijgo.org/article/S0020-7292(18)30282-3/fulltext
    section: Table 1 FIGO parameters for normal menstrual cycle
    number_checked: Frequency 24-38 days, variation <= 7-9 days, duration <= 8 days
    date: '2018'
    evidence_status: evidence_located
    approval_status: mapping_pending_doctor_approval
  pending_clinical_decision: DISC-01
