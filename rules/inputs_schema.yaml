version: 0.2-alpha-audited-v4
audit_date: '2026-11-03'
governance:
  target_population: Women aged 18 to 40 years
  clinical_context: Indian healthcare setting with international evidence base (NICE, FIGO, ACOG, CDC, RCOG, ESHRE, ASRM,
    ICMR, FOGSI)
  triage_hierarchy: Green (Self-Care + Safety Net) < Yellow (Teleconsultation) < Amber (In-Person Clinic Visit / Specialist)
    < Red (Immediate Emergency A&E)
  unknown_answer_policy: Missing/unknown never counts as yes/no. Critical or gating unknowns return need_more_info or default
    to safer branch. Green strictly blocked if unknown.
summary:
  total_variables: 86
  patient_inputs_count: 72
  derived_variables_count: 14
patient_inputs:
- id: P1
  name: age
  category: Demographics
  type: number (years)
  allowed_values: 18 to 40 (unknown)
  unknown_handling: need_more_info; blocks triage if missing
  references: FERT-001, FERT-002, FERT-003, FERT-004, IRR-011, D2, D7
  description: Patient age in completed years; strictly scoped to 18-40.
- id: P2
  name: never_had_period
  category: Menstrual History
  type: yes_no_unknown
  allowed_values: '[yes, no, unknown]'
  unknown_handling: need_more_info in amenorrhea; ask P2
  references: IRR-011, PATH-AMEN-01 (S1), D7
  description: 'Primary amenorrhea flag: patient has never had a spontaneous menstrual period.'
- id: P3
  name: menarche_age
  category: Menstrual History
  type: number (years)
  allowed_values: 8 to 25 (unknown)
  unknown_handling: Assume >= 3 yrs post-menarche if P1 >= 21; else ask
  references: D7, 2023 PCOS Guideline
  description: Age at first period; used to establish adult gynecological age (>= 3 years post-menarche).
- id: P4
  name: pregnancy_possible
  category: Pregnancy & Sexual History
  type: choice
  allowed_values: '[yes, no, not_sure]'
  unknown_handling: not_sure treated as possible (D1 = unknown -> need_more_info)
  references: GATE-001, D1, all pathways
  description: Patient belief regarding current pregnancy possibility based on sexual exposure.
- id: P5
  name: unprotected_sex_in_last_12_months
  category: Pregnancy & Sexual History
  type: yes_no_unknown
  allowed_values: '[yes, no, unknown]'
  unknown_handling: unknown treated as possible (D1 = unknown)
  references: GATE-001, D1
  description: Unprotected intercourse or barrier/contraceptive failure in last 12 months.
- id: P6
  name: days_since_last_unprotected_sex
  category: Pregnancy & Sexual History
