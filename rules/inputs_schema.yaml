  allowed_values: 0 to 365 (unknown)
  unknown_handling: Sets D10 = unknown -> need_more_info
  references: GATE-001, D1, D10
  description: Days elapsed since the most recent episode of unprotected intercourse.
- id: P7
  name: pregnancy_test_result
