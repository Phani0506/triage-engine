  unknown_handling: yes or unknown in PATH-FERT-01 triggers FERT-006 (Amber)
  references: FERT-001, FERT-006, D9, PATH-FERT-01
  description: Prior history of ectopic pregnancy.
- id: P71
  name: prior_tubal_or_pelvic_surgery
  category: Fertility & Tubal Risk
  type: yes_no_unknown
  allowed_values: '[yes, no, unknown]'
  unknown_handling: yes or unknown in PATH-FERT-01 triggers FERT-006 (Amber)
  references: FERT-001, FERT-006, D9, PATH-FERT-01
  description: Prior surgery involving fallopian tubes, ovaries, uterus, or appendix.
- id: P72
  name: unable_to_have_penetrative_intercourse
  category: Fertility & Sexual Health
  type: yes_no_unknown
  allowed_values: '[yes, no, unknown]'
  unknown_handling: yes or unknown in PATH-FERT-01 triggers FERT-008 (Amber)
  references: FERT-001, FERT-008, PATH-FERT-01
  description: Inability to engage in penetrative vaginal intercourse (vaginismus, dyspareunia).
derived_variables:
- id: D1
  name: pregnancy_excluded
  category: Derived Gate
  type: true/false/unknown
  allowed_values: true / false / unknown
  unknown_handling: unknown blocks non-pregnancy pathways
  references: GATE-001, RF-001, RF-002, RF-006, EP-001, all pathways
  description: 'Precedence hierarchy: false if P7==positive; true if (P4==no & P5==no) OR (P7==negative & D10>=21 with no
    subsequent sex); unknown if P7==negative & D10<21, or untested with pregnancy possible.'
- id: D2
  name: age_cohort
  category: Derived Demographics
  type: string
  allowed_values: 18_25 / 26_34 / 35_40 / out_of_scope / unknown
  unknown_handling: unknown -> need_more_info
  references: FERT-001 to FERT-004, IRR-011
  description: 'Age grouping: 18-25, 26-34, 35-40, or out_of_scope (<18 or >40).'
- id: D3
  name: cocp_washout_required
  category: Derived Contraception
  type: true/false/unknown
  allowed_values: true / false / unknown
  unknown_handling: unknown -> need_more_info in PCOS
  references: GATE-003A, D5, PATH-PCOS-01
  description: true if P9==cocp_combined_pill OR P11==yes (2023 Guideline PP 1.2.6 COCP 3-month washout).
- id: D4
  name: progestin_contraception_active
  category: Derived Contraception
  type: true/false/unknown
  allowed_values: true / false / unknown
  unknown_handling: unknown -> need_more_info in bleeding
  references: GATE-003B, D5, PATH-PCOS-01
  description: true if P9 in [progestin_pill, progestin_implant, hormonal_iud, injection_depo].
- id: D5
  name: hormonal_cycle_interference
  category: Derived Contraception
  type: true/false/unknown
  allowed_values: true / false / unknown
  unknown_handling: unknown -> need_more_info
  references: PATH-AMEN-01 (S4), PATH-PCOS-01 (S1)
  description: 'Composite flag: D3 OR D4.'
- id: D6
  name: physiological_lactational_amenorrhea
  category: Derived Obstetric
  type: true/false/unknown
  allowed_values: true / false / unknown
  unknown_handling: unknown -> need_more_info if postpartum
  references: GATE-004, PATH-AMEN-01 (S4)
  description: 'Formal LAM: true if P16==yes (exclusively breastfeeding) AND P15 in [within_6_weeks, 6_to_12_weeks, 12_weeks_to_6_months].
    Extended breastfeeding amenorrhea: P15==6_to_12_months & P16==yes. Non-lactating amenorrhea >12 weeks is abnormal secondary
    amenorrhea (P16==no & P15 in [12_weeks_to_6_months, 6_to_12_months, more_than_12_months_ago]).'
- id: D7
  name: adult_gynecological_age
  category: Derived Gynecological
  type: true/false/unknown
  allowed_values: true / false / unknown
  unknown_handling: unknown -> need_more_info (ask menarche age P3 rather than assuming maturity from age)
  references: PCOS-001 to PCOS-006, D12
  description: 'Gynecological maturity: false if P2==yes; true if (P1-P3)>=3; false if (P1-P3)<3; unknown if P3==unknown.
    Do NOT assume gynecological maturity from chronological age (e.g. a 21-year-old with menarche at 19 is only 2 years post-menarche).'
- id: D8
  name: sti_risk_present
  category: Derived Sexual Health
  type: true/false/unknown
  allowed_values: true / false / unknown
  unknown_handling: unknown if P13 unknown; context flag only, never auto-escalates; symptomatic pathways escalate on symptoms
  references: GATE-006, IRR-013 (context only)
  description: true if P13 == yes; false if P13 == no; unknown otherwise. Age < 25 is a screening-eligibility note, NOT an
    infection-risk input and not an escalation trigger. Pending doctor approval (DEC-11).
- id: D9
  name: tubal_risk_history
  category: Derived Fertility Risk
  type: true/false/unknown
  allowed_values: true / false / unknown
  unknown_handling: unknown -> need_more_info in PATH-FERT-01
  references: FERT-001, FERT-006, PATH-FERT-01
  description: 'Composite tubal risk: true if P69==yes OR P70==yes OR P71==yes.'
- id: D10
  name: unprotected_sex_to_test_interval_days
  category: Derived Testing Interval
  type: number/unknown
  allowed_values: 0 to 365 (unknown)
  unknown_handling: unknown -> need_more_info
  references: GATE-001, D1
  description: 'Calculated interval: P6 - P8; must be >= 21 days for negative urine test validity per NHS/FSRH.'
- id: D11
  name: reported_hemodynamic_instability
  category: Derived Vital Stability
  type: true/false/unknown
  allowed_values: true / false / unknown
  unknown_handling: unknown -> need_more_info in acute bleeding
  references: RF-003, RF-004, IRR-007A
  description: 'Patient-reported instability proxy: P25==yes (syncope/collapse) is direct instability; P26==yes (racing heart
    at rest) acts as early instability proxy specifically with acute bleeding (P24) or severe pain (P19).'
- id: D12
  name: pcos_ovulatory_dysfunction_pattern
  category: Derived Ovulatory Pattern
  type: true/false/unknown
  allowed_values: true / false / unknown
  unknown_handling: unknown -> need_more_info
  references: PCOS-001, PCOS-003, PCOS-004, FERT-005
  description: true if (P36 < 21 OR P36 > 35 OR P37 < 8 OR P35 > 90) with D7==true, D5==false, D1==true.
- id: D13
  name: endometriosis_suspicion_signal
  category: Derived Endometriosis
  type: true/false/unknown
  allowed_values: true / false / unknown
  unknown_handling: unknown -> need_more_info in PATH-FERT-01
  references: FERT-001, PATH-FERT-01
  description: 'Composite endometriosis signal: P58==yes OR P61==yes OR P62==yes OR P63==yes OR P64==yes.'
- id: D14
  name: pelvic_infection_severity_marker
  category: Derived Sepsis Risk
  type: true/false/unknown
  allowed_values: true / false / unknown
  unknown_handling: unknown -> ask P28/P30/P31
  references: RF-005, IRR-013
  description: "Systemic-severity proxy, OR logic: ANY ONE of P28==yes (fever >38.5\xB0C), P30==yes (severely unwell/prostrate),\
    \ P31==yes (persistent vomiting, cannot keep fluids/tablets down) sets D14 = true. Intended logic (single marker vs combination)\
    \ is a project choice pending doctor approval (DEC-02). CDC lists these as hospitalisation criteria, not as a validated\
    \ patient-reported Red trigger."
